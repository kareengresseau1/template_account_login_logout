global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-alerts.yml

scrape_configs:
  - job_name: account-login-logout
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - account-login-logout:8080

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
